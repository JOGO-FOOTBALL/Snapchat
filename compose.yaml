services:
  snapchat-repost:
    image: snapchat-repost
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env

    # Default command; override per-run instead of editing this file, e.g.:
    #   docker compose run --rm snapchat-repost python Snapchat_Repost.py queue
    #   docker compose run --rm snapchat-repost python Snapchat_Repost.py approve --post_id <ID>
    # Other commands: list, reject --post_id <ID>, publish, check
    command: ["python", "Snapchat_Repost.py", "list"]
