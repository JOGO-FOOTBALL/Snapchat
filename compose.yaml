  story-publisher:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["streamlit", "run", "src/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      # Host port 8502, not 8501 - 8501 is already taken by another local
      # project's container. The app still listens on 8501 inside the container.
      - "8502:8501"
